[project]
name = "trazo-hidraulico-api"
version = "0.1.0"
description = "API de Trazo Hidráulico: diseño y simulación de redes de agua potable con OWA-EPANET"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "geoalchemy2>=0.16",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "owa-epanet==2.3.5",
    "pyproj>=3.7",
    "shapely>=2.0",
    "redis>=5.2",
    "python-multipart>=0.0.18",
    "numpy>=2.1",
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
