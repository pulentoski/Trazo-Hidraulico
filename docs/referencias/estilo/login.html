<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingresar · Trazo Hidráulico</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;--bg1:#0d1d38;--bg2:#050d1a;--card:rgba(9,21,41,.88);--line:#1e293b;--field:#050d1a;--fline:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#22d3ee;--btn1:#0077e6;--btn2:#0099ff;--onaccent:#fff;--logo:#00d2ff;--river:#0ea5e9;--ink:#fff;--shadow:0 20px 60px rgba(0,0,0,.55);
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html.light{color-scheme:light;--bg1:#ffffff;--bg2:#eef3f9;--card:rgba(255,255,255,.92);--line:#d3deed;--field:#eaf1f9;--fline:#d3deed;--text:#0f172a;--muted:#64748b;--accent:#0284c7;--logo:#0284c7;--river:#0ea5e9;--ink:#000;--shadow:0 6px 18px rgba(15,23,42,.08)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Inter',system-ui,sans-serif;color:var(--text);background:radial-gradient(ellipse at 50% -10%,var(--bg1),var(--bg2) 70%) fixed;overflow-x:hidden;display:flex;align-items:center;justify-content:flex-start;padding:56px 16px 56px var(--gx)}
:root{--gx:max(16px,calc((100vw - 1120px) / 2))}
@keyframes cA{50%{transform:translateX(14px)}}@keyframes cB{50%{transform:translateX(-12px)}}
@keyframes rain{0%{transform:translateY(-10px);opacity:0}20%,85%{opacity:.95}100%{transform:translateY(58px);opacity:0}}
@keyframes snow{0%{transform:translate(0,-8px);opacity:0}25%{opacity:1}50%{transform:translate(4px,22px)}100%{transform:translate(-3px,54px);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-48}}@keyframes pdash{to{stroke-dashoffset:-32}}
@keyframes evap{0%{transform:translateY(0);opacity:0}30%{opacity:.8}100%{transform:translateY(-62px);opacity:0}}
@keyframes pul{0%,100%{opacity:.5}50%{opacity:1}}@keyframes sun{50%{transform:scale(1.12);opacity:.6}}
@keyframes spin{to{transform:rotate(360deg)}}
.c1{animation:cA 11s ease-in-out infinite}.c2{animation:cB 14s ease-in-out infinite}.c3{animation:cA 16s ease-in-out infinite}
.r1{animation:rain 1.8s linear infinite}.r2{animation:rain 1.8s linear .6s infinite}.r3{animation:rain 1.8s linear 1.2s infinite}
.s1{animation:snow 3.2s ease-in-out infinite}.s2{animation:snow 3.2s ease-in-out 1.1s infinite}.s3{animation:snow 3.2s ease-in-out 2.2s infinite}
.river{stroke-dasharray:12 12;animation:dash 1.8s linear infinite}.pipe{stroke-dasharray:8 8;animation:pdash 1.2s linear infinite}
.e1{animation:evap 4.5s ease-out infinite}.e2{animation:evap 4.5s ease-out 1.5s infinite}.e3{animation:evap 4.5s ease-out 3s infinite}
.sunr{transform-origin:760px 58px;animation:sun 6s ease-in-out infinite}.tank{animation:pul 3s ease-in-out infinite}
@keyframes wv{to{transform:translateX(-40px)}}@keyframes wv2{to{transform:translateX(-60px)}}
@keyframes boat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-2px) rotate(3deg)}}
@keyframes condor{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(60px,-8px) rotate(-4deg)}50%{transform:translate(120px,2px) rotate(0)}75%{transform:translate(60px,10px) rotate(4deg)}}
@keyframes bob{50%{transform:translateY(-1.6px)}}@keyframes sip{0%,22%{transform:rotate(0)}42%,62%{transform:rotate(-78deg)}82%,100%{transform:rotate(0)}}
@keyframes drip{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(13px);opacity:0}}
.w1{animation:wv 2.6s linear infinite}.w2{animation:wv2 3.8s linear infinite}.w3{animation:wv 2.2s linear infinite reverse}
.boat{transform-box:fill-box;transform-origin:center bottom;animation:boat 3.5s ease-in-out infinite}
.condor{animation:condor 22s ease-in-out infinite}
.bob{animation:bob 1.6s ease-in-out infinite}.sip{transform-box:fill-box;transform-origin:0 0;animation:sip 4s ease-in-out infinite}
.drip{animation:drip 1.2s linear infinite}.drip.b{animation-delay:.6s}
@keyframes flag{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-5deg) scaleX(.93)}}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:flag 2.2s ease-in-out infinite}
.paused *{animation-play-state:paused!important}
[data-tip]{pointer-events:visiblePainted;cursor:help}.hit{fill:none;stroke:transparent;pointer-events:stroke!important}
#tip{position:fixed;z-index:6;max-width:250px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid color-mix(in srgb,#06b6d4 45%,transparent);box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12.5px;line-height:1.45;color:var(--muted);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
#tip.on{opacity:1;transform:none}#tip b{display:block;color:var(--accent);font-size:13px;font-weight:600;margin-bottom:2px}
.sky-ink{stroke:var(--ink)}.dot{fill:var(--ink)}
#scene{position:fixed;left:calc(var(--gx) + 360px);right:auto;width:min(calc(100vw - var(--gx) - 376px),760px);top:50%;transform:translateY(-50%);aspect-ratio:1200/340;pointer-events:none;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 14%,#000 92%,transparent 100%),linear-gradient(to bottom,#000 80%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 14%,#000 92%,transparent 100%),linear-gradient(to bottom,#000 80%,transparent 100%);mask-composite:intersect}

@media(max-width:860px){body{justify-content:center;padding:24px 16px 120px}#scene{left:0;right:auto;top:auto;bottom:0;transform:none;width:100%;height:44vh;aspect-ratio:auto;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 35%);-webkit-mask-composite:source-over;mask-image:linear-gradient(to bottom,transparent 0,#000 35%);mask-composite:add}}
#scene svg{width:100%;height:100%;display:block}
.card{position:relative;z-index:2;width:100%;max-width:420px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--accent) 18%,transparent);display:flex;align-items:center;justify-content:center}
.brand b{font-size:24px;font-weight:600;letter-spacing:-.01em}.brand b span{color:var(--accent)}
.sub{color:var(--muted);font-size:14px;line-height:1.5;margin:12px 0 22px}
h2{font-size:21px;margin:0 0 20px;font-weight:600}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 7px}
.field{position:relative;margin-bottom:18px}
input{width:100%;background:var(--field);border:1px solid var(--fline);border-radius:8px;padding:11px 12px;font:inherit;font-size:14px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:var(--muted);opacity:.7}
input:focus{border-color:#06b6d4;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
input.bad{border-color:#e5484d}
.eye{position:absolute;right:6px;bottom:5px;background:none;border:0;color:var(--muted);padding:6px;border-radius:6px;cursor:pointer}.eye:hover{color:var(--text)}
.err{color:#f08a8d;font-size:12px;margin:-10px 0 14px;min-height:0}
html.light .err{color:#c2272d}
.btn{width:100%;height:42px;border:0;border-radius:8px;background:linear-gradient(90deg,var(--btn1),var(--btn2));color:var(--onaccent);box-shadow:0 8px 20px rgba(0,119,230,.25);font:inherit;font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:filter .2s,transform .1s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.99)}.btn[disabled]{opacity:.75;cursor:progress}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:none}
.loading .spin{display:block}
.forgot{display:inline-block;margin-top:14px;font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font-family:inherit}.forgot:hover{color:var(--accent)}
.tools{position:fixed;z-index:3;top:calc(14px + env(safe-area-inset-top,0px));right:14px;display:flex;gap:8px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}.ib:hover{border-color:var(--accent)}
.foot{position:fixed;z-index:3;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.toast{position:fixed;z-index:5;bottom:56px;left:50%;transform:translate(-50%,30px);opacity:0;transition:all .3s;pointer-events:none;background:var(--card);border:1px solid color-mix(in srgb,#06b6d4 40%,transparent);color:var(--text);padding:11px 16px;border-radius:12px;font-size:13px;max-width:90vw;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<main class="card">
  <div class="brand">
    <div class="mark"><svg width="26" height="26" viewBox="0 0 120 70" fill="none"><path d="M12 56L46 16L66 40L82 24L108 56" stroke="var(--logo)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M35 29L46 16L56 28L49 32L43 26Z" fill="var(--text)"/><path d="M24 52C42 42 58 58 76 46C88 38 98 46 106 52" stroke="var(--river)" stroke-width="5" stroke-linecap="round"/></svg></div>
    <b><span>Trazo</span> Hidráulico</b>
  </div>
  <p class="sub">Diseño, simulación y gestión de redes de agua potable</p>
  <h2>Ingresar</h2>
  <form id="f" novalidate onsubmit="return login(event)">
    <div class="field"><label for="em">Correo</label><input id="em" type="email" autocomplete="username" placeholder="correo@ejemplo.cl" inputmode="email"></div>
    <div class="field"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" style="padding-right:42px"><button type="button" class="eye" id="eye" onclick="showPw()" title="Mostrar u ocultar contraseña" aria-label="Mostrar u ocultar contraseña"></button></div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="go" type="submit"><span class="spin"></span><span id="gt">Ingresar</span></button>
  </form>
  <button class="forgot" onclick="toast('Te enviaremos un enlace para restablecer tu contraseña.')">¿Olvidó su contraseña?</button>
</main>
<div class="foot">Trazo Hidráulico • versión 1.0.0</div>
<div class="toast" id="toast"></div>
<div id="tip" role="tooltip"></div>

<script>
const $=id=>document.getElementById(id);
const ic=(d,s=1.8)=>`<svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="${s}" d="${d}"/></svg>`;
const D={sun:"M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z",moon:"M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z",pause:"M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z",play:"M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664zM21 12a9 9 0 11-18 0 9 9 0 0118 0z",eye:"M15 12a3 3 0 11-6 0 3 3 0 016 0zM2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z",eyeoff:"M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"};
function applyTheme(t){document.documentElement.classList.toggle('light',t==='light');$('th').innerHTML=ic(t==='light'?D.moon:D.sun);try{localStorage.setItem('trazo-theme',t)}catch(e){}}
function toggleTheme(){const l=document.documentElement.classList.contains('light');applyTheme(l?'dark':'light')}
let saved='dark';try{saved=localStorage.getItem('trazo-theme')||'dark'}catch(e){}
applyTheme(saved);
let paused=false;$('pp').innerHTML=ic(D.pause);
function togglePlay(){paused=!paused;$('cycle').classList.toggle('paused',paused);$('pp').innerHTML=ic(paused?D.play:D.pause)}
let shown=false;$('eye').innerHTML=ic(D.eye);
function showPw(){shown=!shown;$('pw').type=shown?'text':'password';$('eye').innerHTML=ic(shown?D.eyeoff:D.eye)}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3400)}
function login(e){e.preventDefault();const em=$('em'),pw=$('pw'),err=$('err');
em.classList.remove('bad');pw.classList.remove('bad');err.textContent='';
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim())){em.classList.add('bad');err.textContent='Ingresa un correo válido.';em.focus();return false}
if(pw.value.length<1){pw.classList.add('bad');err.textContent='Ingresa tu contraseña.';pw.focus();return false}
const b=$('go');b.disabled=true;b.classList.add('loading');$('gt').textContent='Ingresando…';
setTimeout(()=>{b.disabled=false;b.classList.remove('loading');$('gt').textContent='Ingresar';toast('Acceso simulado: aquí conectas tu autenticación real.')},1300);return false}
// Tooltip de elementos de la escena
(function(){
const tip=$('tip'),svg=$('cycle');let cur=null;
function place(e){const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY-h-12;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y<8)y=e.clientY+18;tip.style.left=x+'px';tip.style.top=y+'px'}
svg.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(!el||el===cur)return;cur=el;const[t,d]=el.dataset.tip.split('|');tip.innerHTML='<b></b><span></span>';tip.firstChild.textContent=t;tip.lastChild.textContent=d;tip.classList.add('on');place(e)});
svg.addEventListener('pointermove',e=>{if(cur)place(e)});
svg.addEventListener('pointerout',e=>{const to=e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('[data-tip]');if(to===cur)return;cur=null;tip.classList.remove('on')});
})();
// Nubes interactivas: se apartan y flotan al pasar el mouse (o el dedo) cerca
(function(){
const svg=$('cycle');
const cl=[...svg.querySelectorAll('.cw')].map(g=>({g,x:+g.dataset.x,y:+g.dataset.y,px:0,py:0,vx:0,vy:0}));
let m=null;
function toSvg(e){const ctm=svg.getScreenCTM();if(!ctm)return null;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(ctm.inverse())}
const mv=e=>{m=toSvg(e)};
document.addEventListener('pointermove',mv,{passive:true});
document.addEventListener('mousemove',mv,{passive:true});
document.addEventListener('touchmove',e=>{if(e.touches[0])mv(e.touches[0])},{passive:true});
document.addEventListener('mouseleave',()=>{m=null});
addEventListener('blur',()=>{m=null});
const R=170,PUSH=130;
(function tick(){
cl.forEach(c=>{
let tx=0,ty=0;
if(m){const dx=c.x-m.x,dy=c.y-m.y,d=Math.hypot(dx,dy);
if(d<R){const f=Math.pow(1-d/R,.7),ux=d>1?dx/d:1,uy=d>1?dy/d:-.3;tx=ux*f*PUSH;ty=uy*f*PUSH*.25}}
c.vx+=(tx-c.px)*.08;c.vy+=(ty-c.py)*.08;c.vx*=.85;c.vy*=.85;c.px+=c.vx;c.py+=c.vy;
c.g.setAttribute('transform','translate('+c.px.toFixed(2)+' '+c.py.toFixed(2)+')');
});
requestAnimationFrame(tick)
})();
})();
</script>
